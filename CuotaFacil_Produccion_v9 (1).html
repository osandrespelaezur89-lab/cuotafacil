<html lang="es">
<head>

<title>CuotaFácil</title>

<style>
:root{
  --bg:#eef2f0;
  --card:#ffffff;
  --tx:#111c18;
  --sub:#3e4f49;
  --line:#d0dbd6;
  --acc:#0b6e5c;
  --acc-d:#085547;
  --acc-t:#ffffff;
  --ok:#0f6b32;
  --okb:#dcfce7;
  --ok-bd:#86efac;
  --warn:#9a4d06;
  --warnb:#fef3c7;
  --warn-bd:#fcd34d;
  --bad:#b91c1c;
  --badb:#fee2e2;
  --bad-bd:#fca5a5;
  --pend:#334155;
  --pendb:#e2e8f0;
  --pend-bd:#cbd5e1;
  --shadow:0 2px 8px rgba(15,35,28,.06);
}
html[data-mode="dark"]{
  --bg:#0d1412;
  --card:#16201d;
  --tx:#eef5f2;
  --sub:#a4b7b0;
  --line:#283631;
  --acc:#2dd4bf;
  --acc-d:#14b8a6;
  --acc-t:#05241f;
  --ok:#4ade80;
  --okb:#143020;
  --ok-bd:#1e4d32;
  --warn:#fbbf24;
  --warnb:#33260d;
  --warn-bd:#5c4414;
  --bad:#f87171;
  --badb:#381818;
  --bad-bd:#632626;
  --pend:#cbd5e1;
  --pendb:#202b33;
  --pend-bd:#334155;
  --shadow:0 2px 10px rgba(0,0,0,.3);
}
@media (prefers-color-scheme:dark){
  html:not([data-mode="light"]){
    --bg:#0d1412;
    --card:#16201d;
    --tx:#eef5f2;
    --sub:#a4b7b0;
    --line:#283631;
    --acc:#2dd4bf;
    --acc-d:#14b8a6;
    --acc-t:#05241f;
    --ok:#4ade80;
    --okb:#143020;
    --ok-bd:#1e4d32;
    --warn:#fbbf24;
    --warnb:#33260d;
    --warn-bd:#5c4414;
    --bad:#f87171;
    --badb:#381818;
    --bad-bd:#632626;
    --pend:#cbd5e1;
    --pendb:#202b33;
    --pend-bd:#334155;
    --shadow:0 2px 10px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  font-variant-numeric:tabular-nums;
}
#app{max-width:560px;margin:0 auto;padding-bottom:108px}
header{
  padding:16px 18px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:var(--head,var(--card));
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:8;
}
.brand-wrap{display:flex;align-items:center;gap:9px}
.brand-logo{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.brand{font-weight:800;font-size:20px;color:var(--tx);letter-spacing:-.3px;line-height:1.1}
.biz{color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.mode-btn{
  width:38px;height:38px;min-height:38px;padding:0;border-radius:12px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--tx);
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
}
.head-right{display:flex;align-items:center;gap:8px}
.lic-chip{
  font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;
  border:1px solid var(--line);background:var(--bg);color:var(--sub);
  display:inline-flex;align-items:center;gap:5px;cursor:pointer;min-height:32px;
}
.lic-chip.ok{background:var(--okb);color:var(--ok);border-color:var(--ok-bd)}
.lic-chip.warn{background:var(--warnb);color:var(--warn);border-color:var(--warn-bd)}
.lic-chip.bad{background:var(--badb);color:var(--bad);border-color:var(--bad-bd)}

.desk-head{display:none}
main{padding:16px 16px 24px}
h2{font-size:13.5px;margin:24px 0 12px;color:var(--sub);font-weight:800;text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:6px}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}
.card.hero{border-left:5px solid var(--acc)}
.card.hero-bad{border-left:5px solid var(--bad)}
.card.clickable{cursor:pointer;transition:transform .12s ease, border-color .15s ease, box-shadow .15s ease}
.card.clickable:active{transform:scale(.99)}
.big{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.25;margin-top:4px}
.med{font-size:20px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:14.5px;line-height:1.45}
.xs{color:var(--sub);font-size:12.5px;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .card{margin:0;padding:16px 14px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.row-c{display:flex;justify-content:space-between;align-items:center;gap:10px}

.pill{
  font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;
  white-space:nowrap;display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;
}
.pill.ok{background:var(--okb);color:var(--ok);border-color:var(--ok-bd)}
.pill.venc{background:var(--badb);color:var(--bad);border-color:var(--bad-bd)}
.pill.pronto{background:var(--warnb);color:var(--warn);border-color:var(--warn-bd)}
.pill.pend{background:var(--pendb);color:var(--pend);border-color:var(--pend-bd)}

.bar{height:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .35s ease}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
button,.btn{
  font:inherit;font-weight:700;font-size:14.5px;
  border:1.5px solid var(--line);background:var(--card);color:var(--tx);
  padding:10px 14px;border-radius:12px;cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;
  transition:transform .1s ease, background .15s ease, border-color .15s ease;
}
button:active,.btn:active{transform:scale(.98)}
button.primary,.btn.primary{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
button.wa,.btn.wa{background:#22c55e;color:#05240e;border-color:#16a34a}
button.danger{color:var(--bad);border-color:var(--bad)}
button.link{border:0;background:none;color:var(--acc);padding:6px 4px;min-height:40px;font-size:14px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.grow{flex:1}

input,textarea,select{
  font:inherit;width:100%;padding:12px 13px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--card);color:var(--tx);min-height:48px;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
label{display:block;font-size:13.5px;color:var(--sub);margin:12px 0 5px;font-weight:700}

nav{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;
  padding:8px 12px calc(10px + env(safe-area-inset-bottom));z-index:10;
  box-shadow:0 -4px 16px rgba(0,0,0,.06);
}
nav .nav-inner{display:flex;width:100%;max-width:560px;gap:8px;align-items:stretch}
.nav-brand,.nav-foot{display:none}
nav button{
  flex:1;border:0;border-radius:14px;background:none;color:var(--sub);
  min-height:60px;font-size:12.5px;font-weight:700;position:relative;
  flex-direction:column;gap:5px;padding:8px 6px;
}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc);background:var(--soft,var(--okb))}
nav button.on::before{display:none}
.badge{
  position:absolute;top:5px;right:calc(50% - 23px);
  background:var(--bad);color:#fff;border-radius:99px;
  font-size:10.5px;font-weight:800;padding:1px 6px;min-width:18px;text-align:center;
  border:2px solid var(--card);
}

.empty{text-align:center;padding:30px 18px}
.empty-ico{
  width:56px;height:56px;border-radius:16px;background:var(--okb);color:var(--acc);
  display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px;
}
.empty p{color:var(--sub);margin:6px 0 18px;font-size:14.5px}

@keyframes slideUp{from{transform:translateY(28px);opacity:.4}to{transform:translateY(0);opacity:1}}
@keyframes fadePop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.overlay{position:fixed;inset:0;background:rgba(10,18,15,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{
  background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;
  border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));
  animation:slideUp .18s ease-out;
}
.sheet-handle{width:38px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:20px;margin-top:8px}

#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
  background:#111c18;color:#fff;padding:12px 16px;border-radius:14px;font-size:14.5px;
  opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:94%;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 6px 20px rgba(0,0,0,.25);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.act{pointer-events:auto}
#toast button,#toast a{
  min-height:38px;padding:6px 12px;border-radius:9px;border:0;
  font-size:13.5px;font-weight:700;white-space:nowrap;text-decoration:none;
  display:inline-flex;align-items:center;gap:5px;
}
#toast button.u{background:#2dd4bf;color:#05241f}
#toast a.r,#toast button.r{background:#22c55e;color:#05240e}
textarea{min-height:96px;font-size:13px;font-family:ui-monospace,Menlo,monospace}

.m-opt{
  border:2px solid var(--line);background:var(--card);font-weight:700;
  padding:12px 6px;flex-direction:column;gap:4px;min-height:66px;font-size:14px;
}
.m-opt.sel{border-color:var(--acc);background:var(--soft,var(--okb));color:var(--acc)}

.banner{
  padding:12px 14px;border-radius:14px;margin-bottom:12px;font-size:14px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;
}
.banner.warn{background:var(--warnb);color:var(--warn);border:1.5px solid var(--warn-bd)}
.banner.bad{background:var(--badb);color:var(--bad);border:1.5px solid var(--bad-bd)}
.banner button{min-height:38px;padding:6px 12px;font-size:13.5px}

.met-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.met-box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.met-box .xs{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:3px;font-weight:700}
.met-box b{font-size:14.5px;color:var(--tx)}

.month-nav{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:6px 8px;margin-bottom:12px;box-shadow:var(--shadow);
}
.month-nav button{min-height:40px;padding:4px 12px;font-size:14px}

.chart-wrap{margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:13px;color:var(--sub);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

.hist-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line);gap:10px;
}
.hist-item:last-child{border-bottom:0}
.search-box{display:flex;gap:10px;margin-bottom:12px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-bottom:14px}
.f-chip{
  min-height:40px;padding:6px 14px;border-radius:99px;font-size:13.5px;
  border:1.5px solid var(--line);background:var(--card);color:var(--sub);white-space:nowrap;
}
.f-chip.on{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.swatch{
  width:42px;height:42px;border-radius:12px;border:3px solid transparent;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;min-height:42px;padding:0;
}
.swatch.on{border-color:var(--tx);transform:scale(1.06)}
.compact-list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.c-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.c-row:last-child{border-bottom:0}
.c-row:active{background:var(--bg)}
.c-info{min-width:0;flex:1}
.c-name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta{font-size:12px;color:var(--sub);margin-top:1px}
.c-btns{display:flex;align-items:center;gap:6px;flex-shrink:0}
.c-btn{min-height:36px;padding:4px 10px;border-radius:9px;font-size:12.5px}
.grp-tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft,var(--okb));color:var(--acc);margin-left:6px;vertical-align:middle}

.kpi-top,.charts-grid,.cards-grid,.settings-grid{display:block}

/* ==========================================================================
   DISEÑO EXCLUSIVO PARA COMPUTADORA / LAPTOP / PC (pantallas >= 860px)
   El diseño móvil (< 860px) permanece exactamente igual sin cambios.
   ========================================================================== */
@media (min-width:860px){
  #app{
    max-width:none;
    margin:0;
    padding-bottom:40px;
    padding-left:256px;
  }
  /* Ocultar barra móvil superior y convertir navegación en Sidebar lateral fijo */
  header.mob-head{display:none}
  .big{font-size:27px}
  .search-box{margin-bottom:0}
  nav{
    top:0;bottom:0;left:0;right:auto;
    width:256px;
    background:var(--head,var(--card));
    border-top:0;
    border-right:1px solid var(--line);
    padding:22px 14px;
    flex-direction:column;
    justify-content:space-between;
    align-items:stretch;
    box-shadow:2px 0 14px rgba(15,35,28,.04);
  }
  .nav-brand{
    display:flex;align-items:center;gap:11px;
    padding:4px 8px 20px;border-bottom:1px solid var(--line);margin-bottom:16px;
  }
  .nav-brand .biz{max-width:162px}
  nav .nav-inner{
    flex-direction:column;
    max-width:none;
    gap:6px;
  }
  nav button{
    flex:none;
    flex-direction:row;
    justify-content:flex-start;
    min-height:46px;
    padding:10px 14px;
    border-radius:12px;
    font-size:15px;
    gap:11px;
  }
  nav button:hover{background:var(--bg);color:var(--tx)}
  nav button.on{background:var(--soft,var(--okb));color:var(--acc)}
  nav button.on:hover{background:var(--soft,var(--okb));color:var(--acc)}
  nav button.on::before{display:none}
  .badge{
    position:static;
    margin-left:auto;
  }
  .nav-foot{
    display:block;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .nav-foot .mode-btn{
  width:38px;height:38px;min-height:38px;padding:0;border-radius:12px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--tx);
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
}
.head-right{display:flex;align-items:center;gap:8px}
.lic-chip{
    width:100%;
    justify-content:center;
    min-height:38px;
    font-size:12.5px;
  }

  /* Cabecera superior de escritorio */
  .desk-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    max-width:1180px;
    margin:0 auto;
    padding:24px 32px 6px;
  }
  .desk-title{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:0}
  .desk-sub{color:var(--sub);font-size:14px;margin-top:2px}
  .desk-actions{display:flex;align-items:center;gap:10px}

  main{
    max-width:1180px;
    margin:0 auto;
    padding:16px 32px 32px;
  }

  /* Grillas panorámicas para Dashboard */
  .kpi-top{
    display:grid;
    grid-template-columns:1.15fr 1fr;
    gap:16px;
    margin-bottom:16px;
    align-items:stretch;
  }
  .kpi-top .grid{gap:16px}
  .kpi-top > .card{margin:0 !important;display:flex;flex-direction:column;justify-content:center}
  .charts-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:8px;
  }
  .charts-grid > .card{margin-bottom:0}

  /* Grilla de tarjetas de socios y cobros */
  .cards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(330px, 1fr));
    gap:14px;
  }
  .cards-grid > .card{
    margin-bottom:0;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .card.clickable:hover{
    border-color:var(--acc);
    box-shadow:0 6px 18px rgba(15,35,28,.1);
  }

  /* Grilla de 2 columnas en Ajustes */
  .settings-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    align-items:start;
  }
  .settings-grid h2{margin-top:0}

  /* Barra de búsqueda y filtros en una sola fila en PC */
  .toolbar-pc{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }

function encodeSyncPayload(obj){
  var json=JSON.stringify(obj);
  var bytes=new TextEncoder().encode(json);
  var bin='';
  for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  var b64=btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return 'CFSYNC1:'+b64;
}

function decodeSyncPayload(raw){
  var txt=String(raw||'').trim();
  var idx=txt.indexOf('CFSYNC1:');
  if(idx===-1)return null;
  var token=txt.slice(idx+8).split(/[\s&#"'<>]/)[0];
  if(!token)return null;
  try{
    var b64=token.replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length%4)b64+='=';
    var bin=atob(b64);
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    var json=new TextDecoder().decode(bytes);
    var parsed=JSON.parse(json);
    var c=clean(parsed);
    if(!c||c.bad>0)return null;
    return c.st;
  }catch(e){return null;}
}

  val=Math.abs(val);
  var parts=val.toFixed(2).split('.');
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');

function tasaRenovacion(){

  var pct=baseCur>0?Math.round((renCur/baseCur)*100):0;
  var pctPrev=basePrev>0?Math.round((renPrev/basePrev)*100):null;

function playCashSound(){
  if(S.sonido===false)return;
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    var ctx=new Ctx();
    var now=ctx.currentTime;

    /* 1. Ruido metálico del cajón deslizándose ("cha-") */
    var bufLen=Math.floor(ctx.sampleRate*0.14);
    var buf=ctx.createBuffer(1,bufLen,ctx.sampleRate);
    var data=buf.getChannelData(0);
    for(var i=0;i<bufLen;i++){
      data[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*0.045));
    }
    var noise=ctx.createBufferSource();
    noise.buffer=buf;
    var hp=ctx.createBiquadFilter();
    hp.type='bandpass';
    hp.frequency.setValueAtTime(2800,now);
    hp.Q.setValueAtTime(2.2,now);
    var nGain=ctx.createGain();
    nGain.gain.setValueAtTime(0.001,now);
    nGain.gain.linearRampToValueAtTime(0.22,now+0.012);
    nGain.gain.exponentialRampToValueAtTime(0.0001,now+0.13);
    noise.connect(hp);hp.connect(nGain);nGain.connect(ctx.destination);
    noise.start(now);

    /* 2. Tintineo de monedas cayendo + timbre metálico de caja registradora ("-ching!") */
    function bell(freq,start,dur,vol,type){
      var osc=ctx.createOscillator();
      var gain=ctx.createGain();
      osc.type=type||'sine';
      osc.frequency.setValueAtTime(freq,now+start);
      gain.gain.setValueAtTime(0.0001,now+start);
      gain.gain.exponentialRampToValueAtTime(vol,now+start+0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+start+dur);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.start(now+start);
      osc.stop(now+start+dur+0.02);
    }

    /* Choque rápido de monedas */
    bell(3136.0,0.03,0.09,0.10,'sine');     /* Sol7 */
    bell(4186.0,0.055,0.11,0.09,'sine');    /* Do8 */
    bell(3520.0,0.08,0.12,0.08,'sine');     /* La7 */

    /* Campanilla principal resonante de caja registradora ("¡CHING!") */
    bell(1568.0,0.10,0.55,0.22,'sine');     /* Sol6 fundamental */
    bell(3136.0,0.10,0.45,0.12,'sine');     /* Sol7 octava metálica */
    bell(4698.6,0.10,0.30,0.07,'sine');     /* Re8 brillo metálico */
    bell(2349.3,0.105,0.42,0.09,'triangle');/* Re7 armónico cálido */

    setTimeout(function(){try{ctx.close();}catch(e){}},850);
  }catch(e){}
}

function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function hashCode(str){
  var h=2166136261,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return (h>>>0).toString(36).toUpperCase().padStart(6,'0').slice(0,6);
}
function verificarCodigo(raw){
  var c=String(raw||'').trim().toUpperCase();
  var m=/^CF-(\d{4})(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])-([A-Z0-9]{6})$/.exec(c);
  if(!m)return null;
  var fecha=m[1]+'-'+m[2]+'-'+m[3];
  var esperado=hashCode(fecha+'|'+LIC_SECRET);
  if(m[4]!==esperado)return null;
  return {code:c,hasta:fecha};
}
function licStatus(){
  if(!S.licenciaHasta||!RE_DATE.test(S.licenciaHasta)){
    S.licenciaHasta=iso(addDays(T,15));
    save(true);
  }
  var p=S.licenciaHasta.split('-').map(Number);
  var lim=new Date(p[0],p[1]-1,p[2]);
  var diff=Math.round((lim-T)/864e5);
  if(diff>=0)return {ok:true,blocked:false,warn:diff<=5,dias:diff,hasta:S.licenciaHasta};
  var vencHace=Math.abs(diff);
  if(vencHace<=LIC_GRACIA)return {ok:false,blocked:false,warn:true,dias:LIC_GRACIA-vencHace,hasta:S.licenciaHasta,gracia:true};
  return {ok:false,blocked:true,warn:true,dias:0,hasta:S.licenciaHasta};
}

/* ---------- Validación y limpieza ---------- */
var RE_ID=/^[A-Za-z0-9_-]{1,40}$/,RE_YM=/^\d{4}-(0[1-9]|1[0-2])$/,RE_DATE=/^\d{4}-\d{2}-\d{2}$/;
function str(v,n){return String(v==null?'':v).slice(0,n);}
function clean(o){
  if(!o||typeof o!=='object'||!Array.isArray(o.socios))return null;
  var lic=RE_DATE.test(String(o.licenciaHasta||''))?String(o.licenciaHasta):'';
  var usados=Array.isArray(o.usados)?o.usados.filter(function(x){return typeof x==='string'&&x.length<=30;}).slice(-100):[];
  var tema=TEMAS[o.tema]?o.tema:'esmeralda';
  var modo=(o.modo==='claro'||o.modo==='oscuro'||o.modo==='auto')?o.modo:'auto';
  var pin=/^\d{4}$/.test(String(o.pin||''))?String(o.pin):'';
  var sonido=(o.sonido===false)?false:true;
  var lastBackup=RE_DATE.test(String(o.lastBackup||''))?String(o.lastBackup):'';
  var backupSnooze=RE_DATE.test(String(o.backupSnooze||''))?String(o.backupSnooze):'';
  var compacto=!!o.compacto;
  var tpl={};
  if(o.plantillas&&typeof o.plantillas==='object'){
    ['venc','prox','recibo','cumple'].forEach(function(k){
      if(typeof o.plantillas[k]==='string'&&o.plantillas[k].trim())tpl[k]=str(o.plantillas[k],600);
    });
  }
  var out={negocio:str(o.negocio,80).trim()||'Mi negocio',pago:str(o.pago,500),tema:tema,modo:modo,pin:pin,sonido:sonido,compacto:compacto,plantillas:tpl,lastBackup:lastBackup,backupSnooze:backupSnooze,licenciaHasta:lic,usados:usados,socios:[]},bad=0,seen={};
  o.socios.forEach(function(s){
    if(!s||typeof s!=='object'||!RE_ID.test(String(s.id))||seen[s.id]||!str(s.nombre,80).trim()||!RE_YM.test(String(s.inicio))||!Array.isArray(s.pagos)){bad++;return;}
    var dia=parseInt(s.dia,10),monto=Number(s.monto);
    if(!(dia>=1&&dia<=31)||!(monto>0)){bad++;return;}
    seen[s.id]=1;
    var pagos=[],tar=[];
    s.pagos.forEach(function(p){
      if(p&&RE_YM.test(String(p.mes))&&RE_DATE.test(String(p.fecha))&&Number(p.monto)>=0){
        var met=METODOS.indexOf(p.metodo)>-1?p.metodo:'Efectivo';
        pagos.push({mes:p.mes,fecha:p.fecha,monto:round2(p.monto),metodo:met});
      }else bad++;
    });
    if(Array.isArray(s.tarifas))s.tarifas.forEach(function(t){if(t&&RE_YM.test(String(t.desde))&&Number(t.monto)>0)tar.push({desde:t.desde,monto:round2(t.monto)});});
    if(!tar.length)tar=[{desde:s.inicio,monto:round2(monto)}];
    tar.sort(function(a,b){return a.desde<b.desde?-1:(a.desde>b.desde?1:0);});
    var cumple=RE_DATE.test(String(s.cumple||''))?String(s.cumple):'';
    var mat=null;
    if(s.matricula&&typeof s.matricula==='object'&&Number(s.matricula.monto)>0&&RE_DATE.test(String(s.matricula.fecha||''))){
      mat={monto:round2(s.matricula.monto),fecha:s.matricula.fecha,metodo:METODOS.indexOf(s.matricula.metodo)>-1?s.matricula.metodo:'Efectivo'};
    }
    var grupo=str(s.grupo,50).trim();
    out.socios.push({id:String(s.id),nombre:str(s.nombre,80).trim(),tel:str(s.tel,30),grupo:grupo,cumple:cumple,matricula:mat,monto:round2(monto),dia:dia,inicio:s.inicio,tarifas:tar,pagos:pagos});
  });
  return {st:out,bad:bad};
}

function montoMes(s,i){var ym=idxYm(i),m=s.tarifas[0].monto,k;for(k=0;k<s.tarifas.length;k++){if(s.tarifas[k].desde<=ym)m=s.tarifas[k].monto;}return m;}
function pagadoEnMes(s,i){
  var ym=idxYm(i),sum=0;
  s.pagos.forEach(function(p){if(p.mes===ym)sum=round2(sum+p.monto);});
  return sum;
}
function saldoMes(s,i){
  return Math.max(0,round2(montoMes(s,i)-pagadoEnMes(s,i)));
}
function isMesPagado(s,i){
  return saldoMes(s,i)<=0.009;
}


function isDarkActive(){
  if(S.modo==='oscuro')return true;
  if(S.modo==='claro')return false;
  return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
}
function applyTheme(){
  var t=TEMAS[S.tema]||TEMAS.esmeralda;
  var dark=isDarkActive();
  var p=dark?t.d:t.l;
  var doc=document.documentElement;
  if(S.modo==='oscuro')doc.setAttribute('data-mode','dark');
  else if(S.modo==='claro')doc.setAttribute('data-mode','light');
  else doc.removeAttribute('data-mode');
  var r=doc.style;
  r.setProperty('--acc',p.acc);
  r.setProperty('--acc-d',p.accd);
  r.setProperty('--acc-t',p.acct);
  r.setProperty('--bg',p.bg);
  r.setProperty('--card',p.card);
  r.setProperty('--tx',p.tx);
  r.setProperty('--sub',p.sub);
  r.setProperty('--line',p.line);
  r.setProperty('--soft',p.soft);
  r.setProperty('--bar2',p.bar2);
  r.setProperty('--head',p.head);
  var mt=$('meta-theme');if(mt)mt.setAttribute('content',p.head);
}
if(window.matchMedia){
  try{window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);}catch(e){}
}

  }catch(e){}

/* ---------- Motor de estados y cálculos ---------- */
function infoAt(s,refDate,refCur){
  var start=ymIdx(s.inicio),venc=[],i;
  for(i=start;i<=refCur;i++){
    if(saldoMes(s,i)>0.009&&refDate>dueDate(i,s.dia))venc.push(i);
  }
  var curSaldo=saldoMes(s,refCur);
  var curAbonado=pagadoEnMes(s,refCur);
  var curPaid=curSaldo<=0.009,estado,texto;
  if(venc.length){
    estado='venc';
    if(venc.length===1){
      var abV=pagadoEnMes(s,venc[0]);
      texto=abV>0?'Saldo vencido · '+cap(idxLabel(venc[0])):'Vencida · '+cap(idxLabel(venc[0]));
    }else{
      texto=venc.length+' cuotas vencidas';
    }
  }else if(!curPaid&&refCur>=start){
    var dias=Math.round((dueDate(refCur,s.dia)-refDate)/864e5);
    estado=(dias<=3||curAbonado>0)?'pronto':'pend';
    if(curAbonado>0){
      texto='Abono · Resta Bs '+fmt(curSaldo);
    }else{
      texto=dias===0?'Vence hoy':'Vence en '+dias+(dias===1?' día':' días');
    }
  }else if(refCur<start){
    estado='pend';
    texto='Inicia '+idxLabel(start);
  }else{
    estado='ok';
    texto='Al día';
  }
  var deuda=round2(venc.reduce(function(a,i){return a+saldoMes(s,i);},0));
  return {venc:venc,deuda:deuda,curSaldo:curSaldo,curAbonado:curAbonado,estado:estado,texto:texto,curPaid:curPaid,active:refCur>=start};
}
function info(s){return infoAt(s,T,CUR);}

function nextMes(s){var i=ymIdx(s.inicio);while(isMesPagado(s,i))i++;return i;}
function phone(t){
  var d=String(t||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.length===9&&d.charAt(0)==='0')d=d.slice(1);
  if(d.length===8)return '591'+d;
  return d;
}
function payTxt(){var p=(S.pago||'').trim();return p?' Puede pagar: '+p+'.':'';}
function msg(s){
  var inf=info(s),n=s.nombre.trim().split(/\s+/)[0];
  if(inf.venc.length){
    var det=inf.venc.map(function(i){
      var ab=pagadoEnMes(s,i),sal=saldoMes(s,i);
      return ab>0?idxLabel(i)+' (saldo Bs '+fmt(sal)+')':idxLabel(i);
    }).join(', ');
    return applyTpl(getTpl('venc'),{
      nombre:n,completo:s.nombre.trim(),negocio:S.negocio,
      meses:det,mes:idxLabel(inf.venc[0]),monto:fmt(inf.deuda),dia:s.dia,pago:payTxt()
    });
  }
  if(inf.curAbonado>0&&inf.curSaldo>0){
    return applyTpl(getTpl('prox'),{
      nombre:n,completo:s.nombre.trim(),negocio:S.negocio,
      mes:'saldo de '+idxLabel(CUR),meses:idxLabel(CUR),monto:fmt(inf.curSaldo),dia:s.dia,pago:payTxt()
    });
  }
  return applyTpl(getTpl('prox'),{
    nombre:n,completo:s.nombre.trim(),negocio:S.negocio,
    mes:idxLabel(CUR),meses:idxLabel(CUR),monto:fmt(montoMes(s,CUR)),dia:s.dia,pago:payTxt()
  });
}
function receiptMsg(s,p){
  var n=s.nombre.trim().split(/\s+/)[0];
  var idx=ymIdx(p.mes),sal=saldoMes(s,idx),tot=montoMes(s,idx);
  var tipoTxt=(p.monto<tot||sal>0)?'Abono a cuenta':'Cuota completa';
  var saldoLine=sal>0?'\nSaldo pendiente del mes: Bs '+fmt(sal):'';
  return applyTpl(getTpl('recibo'),{
    nombre:n,completo:s.nombre.trim(),negocio:S.negocio,
    mes:cap(idxLabel(idx)),tipo:tipoTxt,monto:fmt(p.monto),
    metodo:p.metodo||'Efectivo',saldo:saldoLine,fecha:fmtDate(p.fecha)
  });
}
function waReceiptLink(s,p){
  var ph=phone(s.tel);
  return ph?'https://wa.me/'+ph+'?text='+encodeURIComponent(receiptMsg(s,p)):'';
}

function parseImport(text){
  var ok=[],bad=[],dup=0,seen={};
  S.socios.forEach(function(s){seen[s.nombre.toLowerCase()]=1;});
  String(text||'').split(/\r?\n/).forEach(function(line,n){
    if(!line.trim())return;
    var sep=line.indexOf('\t')>-1?'\t':(line.indexOf(';')>-1?';':',');
    var c=line.split(sep).map(function(x){return x.trim();});
    var nombre=c[0],tel=c[1]||'',monto=parseFloat((c[2]||'').replace(',','.')),dia=parseInt(c[3],10),ini=c[4]||idxYm(CUR);
    if(!nombre||!(monto>0)||!(dia>=1&&dia<=31)||!RE_YM.test(ini)){bad.push(n+1);return;}
    var key=nombre.toLowerCase();
    if(seen[key]){dup++;return;}
    seen[key]=1;
    ok.push({id:uid(),nombre:nombre,tel:tel,monto:round2(monto),dia:dia,inicio:ini,tarifas:[{desde:ini,monto:round2(monto)}],pagos:[]});
  });
  return {ok:ok,bad:bad,dup:dup};
}
function waLink(s){var p=phone(s.tel);return p?'https://wa.me/'+p+'?text='+encodeURIComponent(msg(s)):'';}
function find(id){return S.socios.filter(function(s){return s.id===id;})[0];}

function copyFallback(text){
  try{
    var ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    var ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){return false;}
}
function copyText(text,okMsg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast(okMsg);},function(){
      if(copyFallback(text))toast(okMsg);else toast('No se pudo copiar automático');
    });
  }else{
    if(copyFallback(text))toast(okMsg);else toast('No se pudo copiar automático');
  }
}

/* ---------- Gráficos SVG nativos ---------- */
function chartIngresosBarras(){
  var meses=[],maxV=0,i;
  for(i=5;i>=0;i--){
    var idx=CUR-i,ym=idxYm(idx),tot=0;
    S.socios.forEach(function(s){
      s.pagos.forEach(function(p){if(p.fecha.slice(0,7)===ym)tot=round2(tot+p.monto);});
      if(s.matricula&&s.matricula.fecha.slice(0,7)===ym)tot=round2(tot+s.matricula.monto);
    });
    if(tot>maxV)maxV=tot;
    meses.push({idx:idx,lbl:cap(MES[idx%12].slice(0,3)),val:tot,isCur:idx===CUR});
  }
  if(maxV<=0)maxV=100;
  var W=320,H=136,padB=24,padT=20,barW=32,gap=18,startX=18;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Gráfico de ingresos por mes">';
  svg+='<line x1="8" y1="'+(H-padB)+'" x2="'+(W-8)+'" y2="'+(H-padB)+'" stroke="var(--line)" stroke-width="1.5"/>';
  meses.forEach(function(m,k){
    var x=startX+k*(barW+gap);
    var usableH=H-padB-padT;
    var bh=m.val>0?Math.max(6,Math.round((m.val/maxV)*usableH)):2;
    var y=(H-padB)-bh;
    var fill=m.isCur?'var(--acc)':'var(--bar2,#7fb3a8)';
    svg+='<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+bh+'" rx="6" fill="'+fill+'"/>';
    if(m.val>0){
      var shortVal=isLocked()?'••':(m.val>=1000?(Math.round(m.val/100)/10)+'k':Math.round(m.val));
      svg+='<text x="'+(x+barW/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--tx)">'+shortVal+'</text>';
    }
    svg+='<text x="'+(x+barW/2)+'" y="'+(H-7)+'" text-anchor="middle" font-size="11.5" font-weight="'+(m.isCur?'800':'600')+'" fill="'+(m.isCur?'var(--acc)':'var(--sub)')+'">'+m.lbl+'</text>';
  });
  svg+='</svg>';
  return svg;
}

function chartCobradoVsPendiente(st){
  var cobradoMes=0,pendienteMes=0;
  S.socios.forEach(function(s){
    var inf=info(s);
    if(inf.active){
      var cuota=montoMes(s,CUR);
      var ab=Math.min(cuota,pagadoEnMes(s,CUR));
      var sal=saldoMes(s,CUR);
      cobradoMes=round2(cobradoMes+ab);
      pendienteMes=round2(pendienteMes+sal);
    }
  });
  var total=round2(cobradoMes+pendienteMes);
  var pct=total>0?Math.round((cobradoMes/total)*100):0;
  var r=36,cx=46,cy=46,circ=2*Math.PI*r;
  var dash=(pct/100)*circ;
  var svg='<svg width="92" height="92" viewBox="0 0 92 92" style="flex-shrink:0" role="img" aria-label="Cobrado versus pendiente">';
  svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--warn-bd)" stroke-width="11"/>';
  if(pct>0){
    svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--acc)" stroke-width="11" stroke-dasharray="'+dash.toFixed(1)+' '+circ.toFixed(1)+'" transform="rotate(-90 '+cx+' '+cy+')" stroke-linecap="round"/>';
  }
  svg+='<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="16" font-weight="800" fill="var(--tx)">'+pct+'%</text>';
  svg+='</svg>';
  return {svg:svg,cobradoMes:cobradoMes,pendienteMes:pendienteMes,pct:pct};
}

function chartEvolucionMorosos(){
  var pts=[],maxM=1,i;
  for(i=5;i>=0;i--){
    var idx=CUR-i;
    var y=Math.floor(idx/12),m=idx%12;
    var refD=(idx===CUR)?T:new Date(y,m+1,0);
    var morosos=0;
    S.socios.forEach(function(s){
      if(ymIdx(s.inicio)<=idx){
        var inf=infoAt(s,refD,idx);
        if(inf.venc.length>0)morosos++;
      }
    });
    if(morosos>maxM)maxM=morosos;
    pts.push({lbl:cap(MES[idx%12].slice(0,3)),val:morosos,isCur:idx===CUR});
  }
  var W=320,H=124,padB=24,padT=22,padX=26;
  var stepX=(W-padX*2)/(pts.length-1);
  var usableH=H-padB-padT;
  var coords=pts.map(function(p,k){
    var x=padX+k*stepX;
    var y=(H-padB)-Math.round((p.val/maxM)*usableH);
    return {x:x,y:y,val:p.val,lbl:p.lbl,isCur:p.isCur};
  });
  var poly=coords.map(function(c){return c.x+','+c.y;}).join(' ');
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Evolución de morosos">';
  svg+='<line x1="8" y1="'+(H-padB)+'" x2="'+(W-8)+'" y2="'+(H-padB)+'" stroke="var(--line)" stroke-width="1.5"/>';
  svg+='<polyline fill="none" stroke="var(--bad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="'+poly+'"/>';
  coords.forEach(function(c){
    svg+='<circle cx="'+c.x+'" cy="'+c.y+'" r="'+(c.isCur?5:4)+'" fill="'+(c.isCur?'var(--bad)':'var(--card)')+'" stroke="var(--bad)" stroke-width="2.5"/>';
    svg+='<text x="'+c.x+'" y="'+(c.y-9)+'" text-anchor="middle" font-size="11" font-weight="800" fill="var(--tx)">'+c.val+'</text>';
    svg+='<text x="'+c.x+'" y="'+(H-7)+'" text-anchor="middle" font-size="11.5" font-weight="'+(c.isCur?'800':'600')+'" fill="'+(c.isCur?'var(--bad)':'var(--sub)')+'">'+c.lbl+'</text>';
  });

function licBanner(){
  var st=licStatus();

function stats(repIdx){
  var targetYm=idxYm(repIdx!=null?repIdx:CUR);
  var cobrado=0,pagadas=0,total=0,porCobrar=0,nVenc=0,nPronto=0,nOk=0,vencList=[];
  var porMetodo={Efectivo:0,QR:0,Transferencia:0};
  S.socios.forEach(function(s){
    var inf=info(s);
    s.pagos.forEach(function(p){
      if(p.fecha.slice(0,7)===targetYm){
        cobrado=round2(cobrado+p.monto);
        var m=METODOS.indexOf(p.metodo)>-1?p.metodo:'Efectivo';
        porMetodo[m]=round2(porMetodo[m]+p.monto);
      }
    });
    if(s.matricula&&s.matricula.fecha.slice(0,7)===targetYm){
      cobrado=round2(cobrado+s.matricula.monto);
      var mm=METODOS.indexOf(s.matricula.metodo)>-1?s.matricula.metodo:'Efectivo';
      porMetodo[mm]=round2(porMetodo[mm]+s.matricula.monto);
    }
    if(inf.active){
      total++;
      if(inf.curPaid)pagadas++;
    }
    if(inf.estado==='venc'){porCobrar=round2(porCobrar+inf.deuda);nVenc++;}
    else if(inf.estado==='pronto'||inf.estado==='pend'){nPronto++;}
    else if(inf.estado==='ok'){nOk++;}
    if(inf.estado==='venc'||inf.estado==='pronto')vencList.push({s:s,inf:inf});
  });
  vencList.sort(function(a,b){return (b.inf.deuda-a.inf.deuda)||a.s.nombre.localeCompare(b.s.nombre);});
  return {cobrado:cobrado,porMetodo:porMetodo,pagadas:pagadas,total:total,porCobrar:porCobrar,nVenc:nVenc,nPronto:nPronto,nOk:nOk,list:vencList};
}

  else h+='<button class="grow" onclick="CF.copiarMsg(\''+s.id+'\')">'+ICO.copy+' Copiar aviso</button>';
  h+='<button class="primary grow" '+(lic.blocked?'disabled':'')+' onclick="CF.abrirCobro(\''+s.id+'\')">Registrar pago ('+esc(cap(MES[nx%12].slice(0,3)))+')</button>';
  h+='</div>';

  /* Grupo / Familia vinculada */
  if(s.grupo){
    var fam=groupMembers(s.grupo);
    h+='<div class="card" style="margin-top:14px;background:var(--bg)"><div class="row-c"><b>👨‍👩‍👧 Grupo: '+esc(s.grupo)+'</b><span class="xs">'+fam.length+(fam.length===1?' integrante':' integrantes')+'</span></div>';
    fam.forEach(function(m){
      var mInf=info(m),mNx=nextMes(m),mSal=saldoMes(m,mNx);
      h+='<div class="row-c" style="padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px"><span>'+esc(m.nombre)+' <span class="xs">('+cap(MES[mNx%12].slice(0,3))+': Bs '+fmt(mSal)+')</span></span>'+pill(mInf)+'</div>';
    });
    if(fam.length>1){
      h+='<div class="actions" style="margin-top:10px"><button class="primary grow" '+(lic.blocked?'disabled':'')+' onclick="CF.abrirCobroGrupo(\''+esc(s.grupo)+'\')">Cobrar a todo el grupo con descuento</button></div>';
    }
    h+='</div>';
  }

  h+='<h2>Historial de pagos ('+s.pagos.length+')</h2>';
  if(!hist.length){
    h+='<div class="sub" style="padding:8px 0">Este cliente aún no tiene pagos registrados.</div>';
  }else{
    h+='<div class="card" style="padding:6px 14px">';
    hist.forEach(function(p){
      var rWa=waReceiptLink(s,p);
      var totM=montoMes(s,ymIdx(p.mes)),esAb=p.monto<totM;
      h+='<div class="hist-item"><div><b>'+cap(idxLabel(ymIdx(p.mes)))+(esAb?' <span style="color:var(--warn);font-size:12px">(Abono)</span>':'')+'</b><div class="xs">Pagado el '+fmtDate(p.fecha)+' · '+(p.metodo||'Efectivo')+'</div></div>';
      h+='<div style="text-align:right"><div style="font-weight:800;color:var(--ok)">Bs '+fmt(p.monto)+'</div>';
      if(rWa)h+='<a class="xs" style="color:var(--acc);font-weight:700;text-decoration:none" target="_blank" rel="noopener" href="'+rWa+'">Enviar recibo ↗</a>';
      h+='</div></div>';
    });
    h+='</div>';
  }

  h+='<div class="actions" style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">';
  h+='<button class="grow" onclick="CF.editarDesdeFicha(\''+s.id+'\')">Editar datos / tarifa</button>';
  h+='<button onclick="CF.cerrarFicha()">Cerrar</button>';
  h+='</div></div></div>';
  return h;
}

  confirmarPagoGrupo:function(){
    var fam=groupMembers(payingGroup);
    if(!fam.length){payingGroup=null;render();return;}
    var pct=Number(groupDisc)||0;
    var factor=1-(pct/100);
    var totalCobrado=0, lineas=[], mainSocio=fam[0];
    fam.forEach(function(m){
      var nx=nextMes(m), sal=saldoMes(m,nx);
      if(sal>0.009){
        var neto=round2(sal*factor);
        /* Registrar pago completo de la cuota aplicando el descuento grupal sobre la tarifa del mes si aplica */
        var ym=idxYm(nx);
        var existeTar=m.tarifas.some(function(t){return t.desde===ym;});
        if(pct>0&&!existeTar){
          m.tarifas.push({desde:ym,monto:neto});
          m.tarifas.push({desde:idxYm(nx+1),monto:montoMes(m,nx)});
          m.tarifas.sort(function(a,b){return a.desde<b.desde?-1:(a.desde>b.desde?1:0);});
        }
        m.pagos.push({mes:ym,fecha:iso(T),monto:neto,metodo:payMetodo});
        totalCobrado=round2(totalCobrado+neto);
        lineas.push('• '+m.nombre+' ('+cap(idxLabel(nx))+'): Bs '+fmt(neto));
      }
    });
    var grpName=payingGroup;
    payingGroup=null;
    if(save()){
      playCashSound();
      render();
      var rTxt='✅ *COMPROBANTE DE PAGO GRUPAL*\n'+S.negocio+'\nGrupo: '+grpName+'\n'+lineas.join('\n')+'\nTotal pagado: Bs '+fmt(totalCobrado)+' ('+payMetodo+')'+(pct>0?' · Desc. '+pct+'%':'')+'\nFecha: '+fmtDate(iso(T))+'\n¡Gracias!';
      var ph=phone(mainSocio.tel);
      var rWa=ph?'https://wa.me/'+ph+'?text='+encodeURIComponent(rTxt):'';

  exportarExcel:function(){
    if(!S.socios.length){toast('Agrega socios antes de exportar');return;}
    var targetYm=idxYm(REP_YM),repLbl=cap(idxLabel(REP_YM));
    function csvCell(v){
      var s=String(v==null?'':v).replace(/"/g,'""');
      return '"'+s+'"';
    }
    var rows=[];
    rows.push(['REPORTE CUOTAFACIL',S.negocio,'Periodo: '+repLbl,'Generado: '+fmtDate(iso(T))].map(csvCell).join(';'));
    rows.push('');
    rows.push(['Socio','Celular','Dia Cobro','Cuota Mensual (Bs)','Estado Hoy','Meses Vencidos','Deuda Vencida (Bs)','Pagado en '+repLbl+' (Bs)','Metodo en '+repLbl,'Ultimo Pago Fecha'].map(csvCell).join(';'));
    var totCuota=0,totDeuda=0,totMes=0;
    S.socios.slice().sort(function(a,b){return a.nombre.localeCompare(b.nombre);}).forEach(function(s){
      var inf=info(s);
      var cuota=montoMes(s,CUR);
      var pagadoMes=0,metodosMes=[];
      s.pagos.forEach(function(p){
        if(p.fecha.slice(0,7)===targetYm){
          pagadoMes=round2(pagadoMes+p.monto);
          if(metodosMes.indexOf(p.metodo|| 'Efectivo')===-1)metodosMes.push(p.metodo||'Efectivo');
        }
      });
      if(s.matricula&&s.matricula.fecha.slice(0,7)===targetYm){
        pagadoMes=round2(pagadoMes+s.matricula.monto);
        if(metodosMes.indexOf(s.matricula.metodo)===-1)metodosMes.push(s.matricula.metodo+' (Matrícula)');
      }
      var ult=s.pagos.length?fmtDate(s.pagos[s.pagos.length-1].fecha):'Sin pagos';
      var vencTxt=inf.venc.length?inf.venc.map(idxLabel).join(', '):'Ninguno';
      totCuota=round2(totCuota+cuota);
      totDeuda=round2(totDeuda+inf.deuda);
      totMes=round2(totMes+pagadoMes);
      rows.push([
        s.nombre,
        s.tel||'',
        s.dia,
        fmt(cuota),
        inf.texto,
        vencTxt,
        fmt(inf.deuda),
        fmt(pagadoMes),
        metodosMes.join(', ')||'-',
        ult
      ].map(csvCell).join(';'));
    });
    rows.push('');
    rows.push(['TOTALES','','',fmt(totCuota),'','',fmt(totDeuda),fmt(totMes),'',''].map(csvCell).join(';'));
    var csvContent='\uFEFF'+rows.join('\r\n');
    try{
      var blob=new Blob([csvContent],{type:'text/csv;charset=utf-8;'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='CuotaFacil_Reporte_'+targetYm+'.csv';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
      toast('✓ Reporte Excel (.csv) descargado');
    }catch(e){toast('No se pudo descargar el archivo');}
  },
  setNeg:function(v){
    S.negocio=v.trim()||'Mi negocio';save(true);
    document.querySelectorAll('.biz').forEach(function(el){el.textContent=S.negocio;});initPWA();
  },
  setPago:function(v){S.pago=v;save(true);},
  verSocio:function(id){viewingId=id;render();},
  cerrarFicha:function(){viewingId=null;render();},
  editarDesdeFicha:function(id){viewingId=null;editing=id;confirmDel=false;confirmUndoId=null;render();},
  edit:function(id){editing=id;confirmDel=false;confirmUndoId=null;render();},
  cerrar:function(){editing=null;confirmDel=false;confirmUndoId=null;render();},
  guardar:function(){
    var nombre=$('f_nombre').value.trim(),tel=$('f_tel').value.trim(),grupo=$('f_grupo')?$('f_grupo').value.trim():'',cumple=$('f_cumple')?$('f_cumple').value:'',monto=round2(parseFloat($('f_monto').value.replace(/\./g,'').replace(',','.'))),dia=parseInt($('f_dia').value,10),inicio=$('f_inicio').value,e=$('err');
    var rawMonto=$('f_monto').value.trim();
    if(/^\d+(\.\d{1,2})?$/.test(rawMonto))monto=round2(parseFloat(rawMonto));
    if(!nombre){e.textContent='Escribe el nombre del socio.';return;}
    if(!(monto>0)){e.textContent='Escribe una cuota mayor a Bs 0,00.';return;}
    if(!(dia>=1&&dia<=31)){e.textContent='El día de cobro debe estar entre 1 y 31.';return;}
    if(!RE_YM.test(inicio)){e.textContent='Elige el mes de inicio.';return;}
    if(cumple&&!RE_DATE.test(cumple))cumple='';
    if(editing==='new'){
      var mat=null;
      if($('f_mat')){
        var rawMat=$('f_mat').value.trim();
        var mVal=/^\d+(\.\d{1,2})?$/.test(rawMat)?round2(parseFloat(rawMat)):round2(parseFloat(rawMat.replace(/\./g,'').replace(',','.')));
        if(mVal>0){
          var mMet=$('f_mat_met')?$('f_mat_met').value:'Efectivo';
          mat={monto:mVal,fecha:iso(T),metodo:METODOS.indexOf(mMet)>-1?mMet:'Efectivo'};
        }
      }
      S.socios.push({id:uid(),nombre:nombre,tel:tel,grupo:grupo,cumple:cumple,matricula:mat,monto:monto,dia:dia,inicio:inicio,tarifas:[{desde:inicio,monto:monto}],pagos:[]});
    }else{
      var s=find(editing);if(!s)return;
      if(s.pagos.length){
        var minPago=s.pagos.reduce(function(m,p){return p.mes<m?p.mes:m;},s.pagos[0].mes);
        if(inicio>minPago){e.textContent='El socio ya tiene pagos desde '+idxLabel(ymIdx(minPago))+'. El inicio no puede ser posterior.';return;}
      }
      var actual=montoMes(s,CUR);
      s.nombre=nombre;s.tel=tel;s.grupo=grupo;s.cumple=cumple;s.dia=dia;s.inicio=inicio;
      if(monto!==actual){
        if(!s.pagos.length&&s.tarifas.length<=1){s.tarifas=[{desde:inicio,monto:monto}];}
        else{
          var d=$('f_desde'),desde=(d&&d.value==='este')?idxYm(CUR):idxYm(CUR+1);
          var keep=s.tarifas.filter(function(t){return t.desde<desde;});
          if(!keep.length&&s.inicio<desde)keep=[{desde:s.inicio,monto:s.tarifas[0].monto}];
          keep.push({desde:desde,monto:monto});s.tarifas=keep;
        }
        s.monto=monto;
      }
    }
    if(save()){editing=null;render();toast('✓ Socio guardado correctamente');}
  },
  eliminar:function(id){
    if(!confirmDel){confirmDel=true;render();return;}
    S.socios=S.socios.filter(function(s){return s.id!==id;});save();editing=null;confirmDel=false;render();toast('Socio eliminado');
  },
  abrirCobro:function(id){
    if(licStatus().blocked){licModal=true;render();return;}
    var s=find(id);if(!s)return;
    paying=id;
    payMesIdx=nextMes(s);
    payMetodo='Efectivo';
    payMonto=String(saldoMes(s,payMesIdx)).replace('.',',');
    render();
  },
  cerrarCobro:function(){paying=null;render();},
  setMetodo:function(m){payMetodo=m;render();},
  setPayMonto:function(v){payMonto=v;},
  setQuickMonto:function(val){
    payMonto=String(round2(val)).replace('.',',');
    var inp=$('p_monto');if(inp)inp.value=payMonto;
  },
  confirmarPago:function(){
    var s=find(paying);if(!s)return;
    var raw=String(payMonto).trim();
    var m=/^\d+(\.\d{1,2})?$/.test(raw)?round2(parseFloat(raw)):round2(parseFloat(raw.replace(/\./g,'').replace(',','.')));
    var e=$('p_err');
    if(!(m>0)){if(e)e.textContent='Ingresa un monto válido mayor a Bs 0,00.';return;}
    var salActual=saldoMes(s,payMesIdx);
    if(salActual<=0.009){paying=null;render();toast('Ese mes ya estaba pagado completo');return;}
    if(m>round2(salActual+0.01)){
      if(e)e.textContent='El monto supera el saldo pendiente de este mes (Bs '+fmt(salActual)+').';
      return;
    }
    var mesYm=idxYm(payMesIdx);
    var p={mes:mesYm,fecha:iso(T),monto:m,metodo:payMetodo};
    s.pagos.push(p);
    var restante=saldoMes(s,payMesIdx);
    paying=null;
    if(save()){
      playCashSound();
      render();
      var rTxt=receiptMsg(s,p),rWa=waReceiptLink(s,p);
      var msgToast=restante>0
        ?'✓ Abono Bs '+fmt(m)+' ('+payMetodo+') · Resta Bs '+fmt(restante)
        :'✓ Cobrado Bs '+fmt(m)+' ('+payMetodo+')';
      toast(msgToast,
        {label:'Deshacer',fn:function(){
          var s2=find(s.id);if(!s2)return;var k=s2.pagos.indexOf(p);
          if(k>-1){s2.pagos.splice(k,1);save();render();toast('Pago deshecho');}
        }},
        {text:rTxt,wa:rWa}
      );
    }
  },
  copiarRecibo:function(){if(lastReceiptText)copyText(lastReceiptText,'Comprobante copiado');},
  undo:function(){var f=undoFn;undoFn=null;$('toast').className='';if(f)f();},
  abrirLic:function(){licModal=true;render();},
  cerrarLic:function(){licModal=false;render();},
  activarLic:function(){
    var raw=$('lic_code').value,e=$('lic_err');
    var v=verificarCodigo(raw);
    if(!v){e.textContent='Código inválido. Verifica las letras y guiones.';return;}
    if(S.usados.indexOf(v.code)>-1){e.textContent='Este código ya fue utilizado anteriormente.';return;}
    if(v.hasta<=S.licenciaHasta&&v.hasta<iso(T)){e.textContent='Este código corresponde a una fecha pasada.';return;}
    S.usados.push(v.code);
    if(v.hasta>S.licenciaHasta)S.licenciaHasta=v.hasta;
    save();licModal=false;render();toast('✓ Suscripción activa hasta el '+fmtDate(v.hasta));
  },
  imp:function(){importing=true;render();},
  cerrarImp:function(){importing=false;render();},
  impPreview:function(){
    var r=parseImport($('imp_txt').value),t=r.ok.length+(r.ok.length===1?' socio listo':' socios listos');
    if(r.bad.length)t+=' · con error: línea'+(r.bad.length>1?'s ':' ')+r.bad.slice(0,6).join(', ')+(r.bad.length>6?'…':'');
    if(r.dup)t+=' · '+r.dup+' ya existían';
    $('imp_info').textContent=t;
  },
  importar:function(){
    var r=parseImport($('imp_txt').value);
    if(!r.ok.length){$('imp_info').textContent='No hay líneas válidas. Cada línea necesita: nombre, teléfono, cuota y día.';return;}
    r.ok.forEach(function(s){S.socios.push(s);});
    save();importing=false;tab='socios';render();
    toast('✓ '+r.ok.length+(r.ok.length===1?' socio importado':' socios importados')+(r.bad.length?' · '+r.bad.length+' líneas omitidas':''));
  },
  deshacer:function(id){
    var s=find(id);if(!s||!s.pagos.length)return;
    if(confirmUndoId!==id){confirmUndoId=id;render();return;}
    var p=s.pagos.pop();confirmUndoId=null;save();render();
    toast('Se quitó el pago de '+idxLabel(ymIdx(p.mes)),{label:'Restaurar',fn:function(){s.pagos.push(p);save();render();}});
  },
  copiarMsg:function(id){var s=find(id);if(!s)return;copyText(msg(s),'Mensaje copiado al portapapeles');},
  descargarRespaldo:function(){
    try{
      var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='CuotaFacil_Respaldo_'+iso(T)+'.json';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
      S.lastBackup=iso(T);save(true);render();
      toast('✓ Respaldo .json guardado en Descargas');
    }catch(e){toast('Usa la opción "Copiar texto"');}
  },
  cargarArchivo:function(inp){
    var f=inp.files&&inp.files[0];if(!f)return;
    var reader=new FileReader();
    reader.onload=function(){
      var c=null;try{c=clean(JSON.parse(reader.result));}catch(e){}
      if(!c||c.bad>0){toast('⚠️ El archivo no es un respaldo válido');return;}
      S=c.st;save();applyTheme();initPWA();tab='resumen';render();toast('✓ Respaldo restaurado desde archivo');
    };
    reader.readAsText(f);
  },
  respaldo:function(){
    var t=JSON.stringify(S),b=$('bk');if(b)b.value=t;
    S.lastBackup=iso(T);save(true);
    copyText(t,'✓ Respaldo copiado (puedes pegarlo en WhatsApp)');
  },
  posponerRespaldo:function(){
    S.backupSnooze=iso(T);save(true);render();
  },
  toggleSonido:function(){
    S.sonido=(S.sonido===false)?true:false;
    save(true);
    if(S.sonido)playCashSound();
    render();
    toast(S.sonido?'🔔 Sonido de cobro activado':'🔇 Sonido de cobro silenciado');
  },
  restaurar:function(){
    var c=null;
    try{c=clean(JSON.parse($('bk').value));}catch(e){}
    if(!c){toast('⚠️ Ese texto no es un respaldo válido');return;}
    if(c.bad>0){toast('⚠️ El respaldo tiene datos inválidos y no se restauró');return;}
    S=c.st;save();applyTheme();initPWA();tab='resumen';render();toast('✓ Respaldo restaurado');
  },
  borrar:function(){
    if(!confirmBorrar){confirmBorrar=true;render();return;}
    var lic=S.licenciaHasta,us=S.usados,pin=S.pin,tema=S.tema,modo=S.modo,son=S.sonido,comp=S.compacto,tpl=S.plantillas;
    S={negocio:'Mi negocio',pago:'',tema:tema,modo:modo,pin:pin,sonido:son,compacto:comp,plantillas:tpl,lastBackup:'',backupSnooze:'',licenciaHasta:lic,usados:us,socios:[]};
    save();confirmBorrar=false;tab='resumen';render();toast('Datos borrados');
  },
  demo:function(){
    var base=[['María Fernanda Rojas','71234567',150,10,0],['Carlos Mamani','72345678',120,5,2],['Luz Quispe','73456789',150,15,1],['Jhonny Flores','74567890',200,28,0],['Daniela Suárez','75678901',120,25,0],['Rodrigo Vargas','76789012',150,1,3]];
    var lic=S.licenciaHasta,us=S.usados;
    S={negocio:'Gimnasio Fuerza Viva',pago:'QR Banco Unión o Tigo Money 71234567',licenciaHasta:lic,usados:us,socios:base.map(function(b,idx){
      var start=CUR-4,debe=b[4],pagos=[],i,lastPaid,dia=b[3];
      lastPaid=debe>0?CUR-debe:(dia%2===0?CUR-1:CUR);
      for(i=start;i<=lastPaid;i++){var d=dueDate(i,dia);if(d>T)d=T;pagos.push({mes:idxYm(i),fecha:iso(d),monto:b[2],metodo:METODOS[(i+idx)%3]});}
      var cumpleStr=(idx===0)?('1996-'+iso(T).slice(5,10)):'';
      var matObj=(idx===0)?{monto:50,fecha:iso(T),metodo:'Efectivo'}:null;
      var grpStr=(idx===0||idx===3)?'Familia Rojas-Flores':'';
      return {id:uid(),nombre:b[0],tel:b[1],grupo:grpStr,cumple:cumpleStr,matricula:matObj,monto:b[2],dia:dia,inicio:idxYm(start),tarifas:[{desde:idxYm(start),monto:b[2]}],pagos:pagos};
    })};
    save();render();toast('✓ Datos de ejemplo cargados');
  }
};
window.CF=CF;
window.__CF_TEST={tab:function(){return tab;},S:function(){return S;},info:info,msg:msg,receiptMsg:receiptMsg,nextMes:nextMes,waLink:waLink,stats:stats,CUR:function(){return CUR;},idxLabel:idxLabel,montoMes:montoMes,checkDay:checkDay,verificarCodigo:verificarCodigo,hashCode:hashCode,fmt:fmt,fmtDate:fmtDate};

function checkDay(){
  var n=new Date();
  if(iso(new Date(n.getFullYear(),n.getMonth(),n.getDate()))===iso(T))return;
  today();
  if(editing===null&&paying===null&&viewingId===null&&!importing&&!licModal)render();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)checkDay();});
window.addEventListener('focus',checkDay);
setInterval(checkDay,60000);

load();
checkUrlSync();
applyTheme();
initPWA();
if(S.socios.length&&stats(CUR).nVenc>0)tab='cobrar';
render();
})();
</script>
